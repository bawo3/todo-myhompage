<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사진 업로드 · 재현 ♥ 혜주</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;600&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&amp;family=Noto+Sans+KR:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A96E;
  --gold-light: #E8D5B0;
  --gold-dark: #8B6F47;
  --rose: #B76E79;
  --cream: #FAF7F2;
  --cream-dark: #F0EAE0;
  --text-dark: #2C2420;
  --text-mid: #5C4A3A;
  --text-light: #8B7355;
  --white: #FFFFFF;
  --no-bg: #FCEAEC;
  --no-color: #C84050;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background:
    radial-gradient(ellipse at 0% 0%, rgba(232,213,176,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 100% 100%, rgba(183,110,121,0.12) 0%, transparent 50%),
    linear-gradient(160deg, #FAF7F2 0%, #F5EFE6 100%);
  color: var(--text-dark);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  padding: 24px 16px 60px;
}

/* 헤더 */
.head {
  max-width: 720px; margin: 0 auto 24px;
  text-align: center;
  padding: 28px 20px;
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(12px);
  border-radius: 24px;
  box-shadow: 0 4px 32px rgba(139,111,71,0.08), 0 1px 0 rgba(255,255,255,0.9) inset;
}
.head-eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px; letter-spacing: 5px;
  color: var(--gold); text-transform: uppercase;
  margin-bottom: 8px;
}
.head-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 22px; font-weight: 400;
  color: var(--text-dark); letter-spacing: 3px;
}
.head-sub {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 13px; color: var(--gold-dark);
  margin-top: 6px; letter-spacing: 1px;
}

.wrap { max-width: 720px; margin: 0 auto; }

/* 업로드 카드 */
.upload-card {
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 24px 20px;
  margin-bottom: 20px;
  box-shadow: 0 6px 32px rgba(139,111,71,0.10), 0 1px 0 rgba(255,255,255,0.9) inset;
}
.upload-zone {
  border: 2px dashed var(--gold-light);
  border-radius: 16px;
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  background: rgba(250,247,242,0.5);
  transition: all 0.25s;
}
.upload-zone:hover, .upload-zone.dragover {
  background: rgba(232,213,176,0.25);
  border-color: var(--gold);
}
.upload-icon { font-size: 36px; margin-bottom: 8px; opacity: 0.7; }
.upload-text {
  font-family: 'Noto Serif KR', serif;
  font-size: 14px; color: var(--text-mid);
  letter-spacing: 1px;
}
.upload-hint {
  font-size: 11px; color: var(--text-light);
  margin-top: 6px;
}
#fileInput { display: none; }

/* 진행 상태 */
.progress-list { margin-top: 16px; }
.progress-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: rgba(250,247,242,0.7);
  border-radius: 10px;
  margin-bottom: 6px;
  font-size: 12px;
}
.progress-name { flex: 1; color: var(--text-mid); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress-status { font-family: 'Cormorant Garamond', serif; letter-spacing: 1px; }
.progress-status.ok   { color: #5A9A5D; }
.progress-status.err  { color: var(--no-color); }
.progress-status.wait { color: var(--gold); }

/* 사진 목록 */
.photos-card {
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 22px 20px;
  box-shadow: 0 6px 32px rgba(139,111,71,0.10), 0 1px 0 rgba(255,255,255,0.9) inset;
}
.photos-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.photos-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 14px; letter-spacing: 2px;
  color: var(--text-dark);
}
.photos-count {
  font-family: 'Cormorant Garamond', serif;
  font-size: 13px; color: var(--gold-dark);
}
.photos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
.photo-item {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  background: var(--cream-dark);
  box-shadow: 0 2px 12px rgba(139,111,71,0.10);
}
.photo-item img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.photo-del {
  position: absolute; top: 6px; right: 6px;
  background: rgba(44,36,32,0.7);
  color: white; border: none;
  width: 28px; height: 28px;
  border-radius: 50%;
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.photo-del:hover { background: var(--no-color); }
.photo-caption-input {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 6px 8px;
  font-size: 11px;
  border: none;
  background: rgba(255,255,255,0.92);
  font-family: 'Noto Sans KR', sans-serif;
  outline: none;
  border-top: 1px solid rgba(201,169,110,0.2);
}

.empty {
  text-align: center; padding: 40px 20px;
  font-family: 'Noto Serif KR', serif;
  font-size: 13px; color: var(--text-light);
  letter-spacing: 1px;
}
.empty-icon { font-size: 32px; margin-bottom: 10px; opacity: 0.4; }

/* 계좌 관리 카드 */
.acc-card {
  background: rgba(255,255,255,0.78);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 22px 20px;
  margin-top: 20px;
  box-shadow: 0 6px 32px rgba(139,111,71,0.10), 0 1px 0 rgba(255,255,255,0.9) inset;
}
.acc-card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px;
}
.acc-card-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 14px; letter-spacing: 2px;
  color: var(--text-dark);
}
.acc-group {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid rgba(201,169,110,0.18);
}
.acc-group:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
.acc-group-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px; letter-spacing: 3px;
  color: var(--gold); text-transform: uppercase;
  margin-bottom: 10px;
}
.acc-group-label.groom { color: #3A6FB5; }
.acc-group-label.bride { color: #C84050; }
.acc-row {
  display: grid;
  grid-template-columns: 80px 90px 1fr;
  gap: 8px;
  margin-bottom: 8px;
}
.acc-row.with-name {
  grid-template-columns: 80px 90px 1fr;
}
.acc-input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid rgba(201,169,110,0.3);
  border-radius: 10px;
  background: rgba(255,255,255,0.85);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px;
  color: var(--text-dark);
  outline: none;
  transition: border 0.2s;
}
.acc-input:focus { border-color: var(--gold); }
.acc-input::placeholder { color: var(--text-light); opacity: 0.6; }
.acc-row-label {
  display: flex; align-items: center;
  font-size: 12px; color: var(--text-mid);
  letter-spacing: 0.5px;
}

@media (max-width: 520px) {
  .acc-row { grid-template-columns: 70px 1fr; gap: 6px; }
  .acc-row .acc-input:first-of-type { grid-column: 1 / -1; }
}

.acc-actions {
  display: flex; gap: 8px;
  margin-top: 18px;
  justify-content: flex-end;
}
.btn-primary {
  padding: 10px 22px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: white;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; font-weight: 500;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(139,111,71,0.25);
  transition: all 0.2s;
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 22px rgba(139,111,71,0.32); }
.btn-primary:disabled { opacity: 0.6; cursor: wait; }

/* 토스트 */
.toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text-dark); color: var(--cream);
  padding: 12px 24px; border-radius: 30px;
  font-size: 12px; letter-spacing: 1px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  z-index: 9999; pointer-events: none;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* 액션 버튼 */
.action-btn {
  padding: 8px 16px;
  border: none;
  border-radius: 30px;
  background: rgba(255,255,255,0.85);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; color: var(--text-mid);
  cursor: pointer;
  box-shadow: 0 2px 14px rgba(139,111,71,0.08);
  transition: all 0.2s;
}
.action-btn:hover { background: var(--white); transform: translateY(-1px); }
.action-btn.danger { color: var(--no-color); }
.action-btn.danger:hover { background: var(--no-bg); }
</style>
</head>
<body>

<!-- 헤더 -->
<header class="head">
  <div class="head-eyebrow">Photo Manager</div>
  <div class="head-title">사진 업로드</div>
  <div class="head-sub">재현 &amp; 혜주 · Wedding Gallery</div>
</header>

<div class="wrap">

  <!-- 업로드 -->
  <div class="upload-card">
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📷</div>
      <div class="upload-text">사진을 선택하거나 끌어다 놓으세요</div>
      <div class="upload-hint">여러 장 한 번에 업로드 가능 · JPG/PNG/WebP</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="progress-list" id="progressList"></div>
  </div>

  <!-- 사진 목록 -->
  <div class="photos-card">
    <div class="photos-header">
      <div class="photos-title">등록된 사진</div>
      <div style="display:flex; gap:8px; align-items:center">
        <div class="photos-count" id="photosCount">0장</div>
        <button class="action-btn danger" onclick="clearAll()">전체 삭제</button>
      </div>
    </div>
    <div class="photos-grid" id="photosGrid"></div>
  </div>

  <!-- 계좌 관리 -->
  <div class="acc-card">
    <div class="acc-card-header">
      <div class="acc-card-title">💳 계좌번호 관리</div>
    </div>

    <!-- 신랑/신부 본인 -->
    <div class="acc-group">
      <div class="acc-group-label groom">🤵 신랑 본인</div>
      <div class="acc-row">
        <input class="acc-input" id="acc-groom-name"   placeholder="예금주" value="김재현">
        <input class="acc-input" id="acc-groom-bank"   placeholder="은행"   value="농협">
        <input class="acc-input" id="acc-groom-number" placeholder="계좌번호">
      </div>
    </div>
    <div class="acc-group">
      <div class="acc-group-label bride">👰 신부 본인</div>
      <div class="acc-row">
        <input class="acc-input" id="acc-bride-name"   placeholder="예금주" value="이혜주">
        <input class="acc-input" id="acc-bride-bank"   placeholder="은행"   value="카카오뱅크">
        <input class="acc-input" id="acc-bride-number" placeholder="계좌번호">
      </div>
    </div>

    <!-- 신랑측 부모님 -->
    <div class="acc-group">
      <div class="acc-group-label groom">🤵 신랑 아버지</div>
      <div class="acc-row">
        <input class="acc-input" id="acc-gf-name"   placeholder="성함" value="김주영">
        <input class="acc-input" id="acc-gf-bank"   placeholder="은행" value="농협">
        <input class="acc-input" id="acc-gf-number" placeholder="계좌번호">
      </div>
    </div>
    <div class="acc-group">
      <div class="acc-group-label groom">🤵 신랑 어머니</div>
      <div class="acc-row">
        <input class="acc-input" id="acc-gm-name"   placeholder="성함" value="강민선">
        <input class="acc-input" id="acc-gm-bank"   placeholder="은행" value="우리">
        <input class="acc-input" id="acc-gm-number" placeholder="계좌번호">
      </div>
    </div>

    <!-- 신부측 부모님 -->
    <div class="acc-group">
      <div class="acc-group-label bride">👰 신부 아버지</div>
      <div class="acc-row">
        <input class="acc-input" id="acc-bf-name"   placeholder="성함" value="이홍기">
        <input class="acc-input" id="acc-bf-bank"   placeholder="은행" value="농협">
        <input class="acc-input" id="acc-bf-number" placeholder="계좌번호">
      </div>
    </div>
    <div class="acc-group">
      <div class="acc-group-label bride">👰 신부 어머니</div>
      <div class="acc-row">
        <input class="acc-input" id="acc-bm-name"   placeholder="성함" value="이은희">
        <input class="acc-input" id="acc-bm-bank"   placeholder="은행" value="농협">
        <input class="acc-input" id="acc-bm-number" placeholder="계좌번호">
      </div>
    </div>

    <div class="acc-actions">
      <button class="btn-primary" id="accSaveBtn" onclick="saveAccounts()">저장</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ── 토스트 ── */
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

/* ── 이미지 리사이즈 + JPEG 변환 (브라우저에서) ── */
async function compressImage(file, maxSize = 1400, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => { img.src = e.target.result; };
    img.onerror = () => reject(new Error('이미지를 읽을 수 없습니다'));
    img.onload = () => {
      let { width, height } = img;
      if (width > maxSize || height > maxSize) {
        const ratio = Math.min(maxSize / width, maxSize / height);
        width  = Math.round(width  * ratio);
        height = Math.round(height * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width  = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    reader.readAsDataURL(file);
  });
}

/* ── 사진 1장 업로드 ── */
async function uploadOne(file, progressEl) {
  try {
    progressEl.querySelector('.progress-status').textContent = '압축...';
    progressEl.querySelector('.progress-status').className = 'progress-status wait';
    const src = await compressImage(file);

    progressEl.querySelector('.progress-status').textContent = '업로드...';
    const res = await fetch('/api/photos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ src })
    });
    if (!res.ok) throw new Error('서버 오류');

    progressEl.querySelector('.progress-status').textContent = '완료 ✓';
    progressEl.querySelector('.progress-status').className = 'progress-status ok';
    setTimeout(() => progressEl.remove(), 1500);
    return true;
  } catch (e) {
    console.error(e);
    progressEl.querySelector('.progress-status').textContent = '실패';
    progressEl.querySelector('.progress-status').className = 'progress-status err';
    return false;
  }
}

/* ── 여러 장 순차 업로드 ── */
async function handleFiles(files) {
  if (!files || !files.length) return;
  const list = document.getElementById('progressList');

  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    const item = document.createElement('div');
    item.className = 'progress-item';
    item.innerHTML = `
      <div class="progress-name">${file.name}</div>
      <div class="progress-status wait">대기</div>`;
    list.appendChild(item);
    await uploadOne(file, item);
  }
  await loadPhotos();
}

/* ── 입력 / 드래그 핸들러 ── */
document.getElementById('fileInput').addEventListener('change', e => {
  handleFiles(e.target.files);
  e.target.value = '';
});

const zone = document.getElementById('uploadZone');
['dragenter', 'dragover'].forEach(ev =>
  zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('dragover'); })
);
['dragleave', 'drop'].forEach(ev =>
  zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('dragover'); })
);
zone.addEventListener('drop', e => {
  handleFiles(e.dataTransfer.files);
});

/* ── 목록 로드 / 렌더 ── */
async function loadPhotos() {
  try {
    const res = await fetch('/api/photos');
    if (!res.ok) throw new Error('서버 오류');
    const list = await res.json();
    renderPhotos(list);
  } catch (e) {
    console.error(e);
    document.getElementById('photosGrid').innerHTML =
      '<div class="empty"><div class="empty-icon">⚠️</div>목록을 불러오지 못했습니다</div>';
  }
}

function renderPhotos(list) {
  document.getElementById('photosCount').textContent = `${list.length}장`;
  const grid = document.getElementById('photosGrid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🌸</div>아직 등록된 사진이 없습니다</div>';
    return;
  }
  /* 최신 사진이 뒤로 — 등록 순서 유지 */
  grid.innerHTML = list.map(p => `
    <div class="photo-item" data-id="${p.id}">
      <img src="${p.src}" alt="${p.caption || ''}" loading="lazy">
      <button class="photo-del" onclick="deletePhoto(${p.id})" title="삭제">✕</button>
    </div>
  `).join('');
}

/* ── 사진 1장 삭제 ── */
async function deletePhoto(id) {
  if (!confirm('이 사진을 삭제하시겠어요?')) return;
  try {
    const res = await fetch(`/api/photos?id=${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('서버 오류');
    await loadPhotos();
    showToast('삭제되었습니다');
  } catch (e) {
    showToast('삭제에 실패했습니다');
  }
}

/* ── 전체 삭제 ── */
async function clearAll() {
  if (!confirm('등록된 모든 사진을 삭제하시겠어요?\n이 작업은 되돌릴 수 없습니다.')) return;
  try {
    const res = await fetch('/api/photos', { method: 'DELETE' });
    if (!res.ok) throw new Error('서버 오류');
    await loadPhotos();
    showToast('모든 사진이 삭제되었습니다');
  } catch (e) {
    showToast('삭제에 실패했습니다');
  }
}

/* ── 계좌 관리 ── */
const ACC_FIELDS = [
  ['groom',       'acc-groom-name',  'acc-groom-bank',  'acc-groom-number'],
  ['bride',       'acc-bride-name',  'acc-bride-bank',  'acc-bride-number'],
  ['groomFather', 'acc-gf-name',     'acc-gf-bank',     'acc-gf-number'],
  ['groomMother', 'acc-gm-name',     'acc-gm-bank',     'acc-gm-number'],
  ['brideFather', 'acc-bf-name',     'acc-bf-bank',     'acc-bf-number'],
  ['brideMother', 'acc-bm-name',     'acc-bm-bank',     'acc-bm-number'],
];

async function loadAccounts() {
  try {
    const res = await fetch('/api/accounts');
    if (!res.ok) return;
    const data = await res.json();
    if (!data) return;
    ACC_FIELDS.forEach(([key, nameId, bankId, numId]) => {
      const acc = data[key];
      if (!acc) return;
      if (acc.name)   document.getElementById(nameId).value   = acc.name;
      if (acc.bank)   document.getElementById(bankId).value   = acc.bank;
      if (acc.number) document.getElementById(numId).value    = acc.number;
    });
  } catch (e) {
    console.error('계좌 로드 실패:', e);
  }
}

async function saveAccounts() {
  const btn = document.getElementById('accSaveBtn');
  btn.disabled = true;
  btn.textContent = '저장 중...';
  const data = {};
  ACC_FIELDS.forEach(([key, nameId, bankId, numId]) => {
    data[key] = {
      name:   document.getElementById(nameId).value.trim(),
      bank:   document.getElementById(bankId).value.trim(),
      number: document.getElementById(numId).value.trim(),
    };
  });
  try {
    const res = await fetch('/api/accounts', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error('서버 오류');
    showToast('계좌 정보가 저장되었습니다');
  } catch (e) {
    showToast('저장에 실패했습니다');
  } finally {
    btn.disabled = false;
    btn.textContent = '저장';
  }
}

/* ── 시작 ── */
loadPhotos();
loadAccounts();
</script>
</body>
</html>
