<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정 등록 · 재현 ♥ 혜주</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;600&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&amp;family=Noto+Sans+KR:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A96E;
  --gold-light: #E8D5B0;
  --gold-dark: #8B6F47;
  --cream: #FAF7F2;
  --text-dark: #2C2420;
  --text-mid: #5C4A3A;
  --text-light: #8B7355;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background:
    radial-gradient(ellipse at 0% 0%, rgba(232,213,176,0.22) 0%, transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(183,110,121,0.12) 0%, transparent 55%),
    linear-gradient(160deg, #FAF7F2 0%, #F0EAE0 100%);
  color: var(--text-dark);
  min-height: 100vh;
  padding: 40px 24px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}

.card {
  width: 100%; max-width: 380px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  border-radius: 28px;
  padding: 36px 28px;
  box-shadow: 0 20px 60px rgba(139,111,71,0.16), 0 1px 0 rgba(255,255,255,0.9) inset;
  text-align: center;
}
.eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px; letter-spacing: 5px;
  color: var(--gold); text-transform: uppercase;
  margin-bottom: 10px;
}
.title {
  font-family: 'Noto Serif KR', serif;
  font-size: 20px; font-weight: 400;
  color: var(--text-dark); letter-spacing: 3px;
  margin-bottom: 6px;
}
.date {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 14px; color: var(--gold-dark);
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.venue {
  font-size: 12px; color: var(--text-light);
  letter-spacing: 0.5px;
  margin-bottom: 24px;
}
.line {
  width: 28px; height: 1px;
  background: var(--gold-light);
  margin: 0 auto 24px;
}

.btn-grid {
  display: grid; gap: 10px;
}
.cal-btn {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  border: 1px solid rgba(201,169,110,0.2);
  border-radius: 14px;
  background: rgba(250,247,242,0.6);
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px; color: var(--text-mid);
  letter-spacing: 0.5px;
  text-align: left;
  text-decoration: none;
  transition: all 0.2s;
}
.cal-btn:hover, .cal-btn:active {
  background: white; transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(139,111,71,0.12);
}
.cal-btn-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 14px; font-weight: 600;
  flex-shrink: 0;
  font-family: 'Cormorant Garamond', serif;
}
.cal-btn-icon.apple  { background: linear-gradient(135deg, #1A1410, #5C4A3A); }
.cal-btn-icon.google { background: linear-gradient(135deg, #4285F4, #1A73E8); }
.cal-btn-icon.naver  { background: linear-gradient(135deg, #03C75A, #02A14A); }
.cal-btn-name { flex: 1; }
.cal-btn-sub  { font-size: 11px; color: var(--text-light); margin-top: 2px; }

.note {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid rgba(201,169,110,0.18);
  font-size: 11px; color: var(--text-light);
  line-height: 1.7; letter-spacing: 0.3px;
}
.note strong { color: var(--gold-dark); font-weight: 500; }

.home-link {
  display: block;
  margin-top: 24px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px; letter-spacing: 2px;
  color: var(--gold-dark);
  text-decoration: none;
  text-align: center;
  opacity: 0.7;
}
.home-link:hover { opacity: 1; }

.toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text-dark); color: var(--cream);
  padding: 12px 24px; border-radius: 30px;
  font-size: 12px; letter-spacing: 1px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  z-index: 9999; pointer-events: none;
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Save the Date</div>
  <div class="title">재현 ♥ 혜주 결혼식</div>
  <div class="date">2026. 11. 07 (토) 오후 12:30</div>
  <div class="venue">문수컨벤션 1층 블루밍하우스홀</div>
  <div class="line"></div>

  <div class="btn-grid">
    <a class="cal-btn" href="#" onclick="downloadICS(event)">
      <div class="cal-btn-icon apple">📅</div>
      <div>
        <div class="cal-btn-name">iPhone · 시스템 캘린더</div>
        <div class="cal-btn-sub">카카오톡 일정과 자동 동기화</div>
      </div>
    </a>
    <a class="cal-btn" id="cal-google" href="#" target="_blank" rel="noopener">
      <div class="cal-btn-icon google">G</div>
      <div>
        <div class="cal-btn-name">Google 캘린더</div>
        <div class="cal-btn-sub">Gmail 계정에 추가</div>
      </div>
    </a>
    <a class="cal-btn" id="cal-naver" href="#" target="_blank" rel="noopener">
      <div class="cal-btn-icon naver">N</div>
      <div>
        <div class="cal-btn-name">네이버 캘린더</div>
        <div class="cal-btn-sub">네이버 계정에 추가</div>
      </div>
    </a>
  </div>

  <div class="note">
    💡 <strong>카카오톡 일정에 등록하려면?</strong><br>
    iPhone은 [설정 → 캘린더 → 계정]에서 카카오 계정 연동을,
    Android는 카카오톡 [더보기 → 톡캘린더]에서 시스템 캘린더 동기화를 켜두시면
    위 버튼으로 추가한 일정이 자동으로 카카오톡에 표시됩니다.
  </div>

  <a class="home-link" href="/">← 청첩장으로 돌아가기</a>
</div>

<div class="toast" id="toast"></div>

<script>
/* 결혼식 일정 정보 */
const EVT = {
  title:    '재현 ♥ 혜주 결혼식',
  location: '문수컨벤션 1층 블루밍하우스홀 · 울산광역시 남구 문수로 44',
  details:  '청첩장: ' + location.origin + '/',
  /* KST 2026-11-07 12:30 ~ 14:30 → UTC 03:30 ~ 05:30 */
  startUTC: '20261107T033000Z',
  endUTC:   '20261107T053000Z',
  /* 네이버 캘린더용 KST 표기 */
  startKST: '20261107T123000',
  endKST:   '20261107T143000',
};

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

/* ICS 파일 생성 + 다운로드 */
function downloadICS(e) {
  if (e) e.preventDefault();
  const esc = s => String(s).replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Wedding Invite//KR',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:wedding-${EVT.startUTC}@invite`,
    `DTSTAMP:${EVT.startUTC}`,
    `DTSTART:${EVT.startUTC}`,
    `DTEND:${EVT.endUTC}`,
    `SUMMARY:${esc(EVT.title)}`,
    `LOCATION:${esc(EVT.location)}`,
    `DESCRIPTION:${esc(EVT.details)}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'TRIGGER:-P1D',
    `DESCRIPTION:내일은 ${esc(EVT.title)}`,
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'wedding.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  showToast('캘린더 파일을 다운로드합니다');
}

/* Google 캘린더 URL */
document.getElementById('cal-google').href =
  'https://calendar.google.com/calendar/render?' + new URLSearchParams({
    action:   'TEMPLATE',
    text:     EVT.title,
    dates:    `${EVT.startUTC}/${EVT.endUTC}`,
    details:  EVT.details,
    location: EVT.location,
    ctz:      'Asia/Seoul'
  });

/* Naver 캘린더 URL */
document.getElementById('cal-naver').href =
  'https://calendar.naver.com/schedule/createByPhone.nhn?' + new URLSearchParams({
    title:    EVT.title,
    body:     EVT.details,
    location: EVT.location,
    start:    EVT.startKST,
    end:      EVT.endKST,
    allDay:   'false'
  });
</script>
</body>
</html>
