<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정 등록 · 재현 ♥ 혜주</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;600&amp;family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&amp;family=Noto+Sans+KR:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A96E;
  --gold-light: #E8D5B0;
  --gold-dark: #8B6F47;
  --cream: #FAF7F2;
  --text-dark: #2C2420;
  --text-mid: #5C4A3A;
  --text-light: #8B7355;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background:
    radial-gradient(ellipse at 0% 0%, rgba(232,213,176,0.22) 0%, transparent 55%),
    radial-gradient(ellipse at 100% 100%, rgba(183,110,121,0.12) 0%, transparent 55%),
    linear-gradient(160deg, #FAF7F2 0%, #F0EAE0 100%);
  color: var(--text-dark);
  min-height: 100vh;
  padding: 40px 24px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 100%; max-width: 380px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(12px);
  border-radius: 28px;
  padding: 44px 28px;
  box-shadow: 0 20px 60px rgba(139,111,71,0.16), 0 1px 0 rgba(255,255,255,0.9) inset;
  text-align: center;
}

/* 체크 마크 애니메이션 */
.check {
  width: 70px; height: 70px;
  margin: 0 auto 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  display: flex; align-items: center; justify-content: center;
  color: white;
  font-size: 34px;
  box-shadow: 0 8px 24px rgba(201,169,110,0.35);
  animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes pop {
  0%   { transform: scale(0);   opacity: 0; }
  60%  { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1);   opacity: 1; }
}

.eyebrow {
  font-family: 'Cormorant Garamond', serif;
  font-size: 11px; letter-spacing: 5px;
  color: var(--gold); text-transform: uppercase;
  margin-bottom: 6px;
}
.title {
  font-family: 'Noto Serif KR', serif;
  font-size: 20px; font-weight: 400;
  color: var(--text-dark); letter-spacing: 3px;
  margin-bottom: 8px;
}
.date {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 14px; color: var(--gold-dark);
  letter-spacing: 1px;
  margin-bottom: 24px;
}
.line {
  width: 28px; height: 1px;
  background: var(--gold-light);
  margin: 0 auto 24px;
}
.guide {
  font-size: 13px; color: var(--text-mid);
  line-height: 1.8; letter-spacing: 0.5px;
  margin-bottom: 20px;
}
.guide strong { color: var(--text-dark); font-weight: 500; }

.note {
  margin-top: 12px;
  padding: 14px 16px;
  background: rgba(250,247,242,0.7);
  border-radius: 12px;
  font-size: 11px; color: var(--text-light);
  line-height: 1.7; letter-spacing: 0.3px;
  text-align: left;
}
.note strong { color: var(--gold-dark); font-weight: 500; }

.retry-btn {
  margin-top: 18px;
  padding: 12px 26px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: white;
  font-family: 'Noto Serif KR', sans-serif;
  font-size: 13px; font-weight: 400;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(139,111,71,0.25);
}
.retry-btn:hover { transform: translateY(-1px); }

.home-link {
  display: block;
  margin-top: 22px;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px; letter-spacing: 2px;
  color: var(--gold-dark);
  text-decoration: none;
  opacity: 0.75;
}
.home-link:hover { opacity: 1; }
</style>
</head>
<body>

<div class="card">
  <div class="check">✓</div>
  <div class="eyebrow">Save the Date</div>
  <div class="title">캘린더 추가</div>
  <div class="date">2026.11.07 (토) 오후 12:30</div>
  <div class="line"></div>

  <div class="guide">
    캘린더 앱에서 <strong>[추가]</strong> 버튼을<br>
    눌러주시면 일정이 저장됩니다.
  </div>

  <button class="retry-btn" onclick="addToCalendar()">다시 시도</button>

  <div class="note">
    💡 <strong>카카오톡 일정과 동기화</strong><br>
    iPhone: 설정 → 캘린더 → 계정 → 카카오 연동<br>
    Android: 카카오톡 → 더보기 → 톡캘린더 → 동기화 ON<br>
    설정해두면 카카오톡 일정에도 자동으로 표시됩니다.
  </div>

  <a class="home-link" href="/">← 청첩장으로 돌아가기</a>
</div>

<script>
const EVT = {
  title:    '재현 ♥ 혜주 결혼식',
  location: '문수컨벤션 1층 블루밍하우스홀 · 울산광역시 남구 문수로 44',
  details:  '청첩장: ' + location.origin + '/',
  startUTC: '20261107T033000Z',  /* KST 2026-11-07 12:30 → UTC 03:30 */
  endUTC:   '20261107T053000Z',  /* KST 2026-11-07 14:30 → UTC 05:30 */
};

function buildICS() {
  const esc = s => String(s).replace(/[\\,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Wedding Invite//KR',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    `UID:wedding-${EVT.startUTC}@invite`,
    `DTSTAMP:${EVT.startUTC}`,
    `DTSTART:${EVT.startUTC}`,
    `DTEND:${EVT.endUTC}`,
    `SUMMARY:${esc(EVT.title)}`,
    `LOCATION:${esc(EVT.location)}`,
    `DESCRIPTION:${esc(EVT.details)}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'TRIGGER:-P1D',
    `DESCRIPTION:내일은 ${esc(EVT.title)}`,
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
}

function addToCalendar() {
  const blob = new Blob([buildICS()], { type: 'text/calendar;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'wedding.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* 페이지 진입과 동시에 자동 다운로드 — 캘린더 앱이 추가 화면 표시 */
window.addEventListener('load', () => {
  setTimeout(addToCalendar, 400);
});
</script>
</body>
</html>
