<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 배경 그라데이션 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#F0E8DA"/>
    </linearGradient>
    <!-- 골드 그라데이션 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5B0"/>
      <stop offset="100%" stop-color="#8B6F47"/>
    </linearGradient>
    <!-- 분홍 한복 (신부) -->
    <linearGradient id="hanbokPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD0DC"/>
      <stop offset="100%" stop-color="#E8A0B0"/>
    </linearGradient>
    <!-- 빨간 치마 (신부) -->
    <linearGradient id="hanbokRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C84050"/>
      <stop offset="100%" stop-color="#8B2030"/>
    </linearGradient>
    <!-- 파란 한복 (신랑) -->
    <linearGradient id="hanbokBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A6FB5"/>
      <stop offset="100%" stop-color="#1F3F70"/>
    </linearGradient>
    <!-- 옥색 저고리 (신랑) -->
    <linearGradient id="hanbokTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A0D0C8"/>
      <stop offset="100%" stop-color="#6FA89F"/>
    </linearGradient>
    <!-- 그림자 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(139,111,71,0.18)"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- 배경 장식 — 흩날리는 꽃잎 -->
  <g opacity="0.5">
    <ellipse cx="100" cy="80"   rx="14" ry="7" fill="#E8D5B0" transform="rotate(-25,100,80)"/>
    <ellipse cx="180" cy="140"  rx="10" ry="5" fill="#C9A96E" transform="rotate(15,180,140)"/>
    <ellipse cx="1100" cy="100" rx="14" ry="7" fill="#E8D5B0" transform="rotate(30,1100,100)"/>
    <ellipse cx="1020" cy="160" rx="10" ry="5" fill="#C9A96E" transform="rotate(-10,1020,160)"/>
    <ellipse cx="80"  cy="540"  rx="12" ry="6" fill="#E8D5B0" transform="rotate(45,80,540)"/>
    <ellipse cx="1120" cy="520" rx="12" ry="6" fill="#C9A96E" transform="rotate(-25,1120,520)"/>

    <!-- 작은 별 점 -->
    <circle cx="240" cy="60"  r="3" fill="#C9A96E"/>
    <circle cx="960" cy="50"  r="3" fill="#C9A96E"/>
    <circle cx="60"  cy="320" r="3" fill="#C9A96E"/>
    <circle cx="1140" cy="320" r="3" fill="#C9A96E"/>
  </g>

  <!-- 모서리 골드 장식 -->
  <g stroke="#C9A96E" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M40 40 L40 100 M40 40 L100 40"/>
    <path d="M1160 40 L1160 100 M1160 40 L1100 40"/>
    <path d="M40 590 L40 530 M40 590 L100 590"/>
    <path d="M1160 590 L1160 530 M1160 590 L1100 590"/>
    <circle cx="40" cy="40" r="3" fill="#C9A96E"/>
    <circle cx="1160" cy="40" r="3" fill="#C9A96E"/>
    <circle cx="40" cy="590" r="3" fill="#C9A96E"/>
    <circle cx="1160" cy="590" r="3" fill="#C9A96E"/>
  </g>

  <!-- 상단 제목 라벨 -->
  <text x="600" y="80" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="18" letter-spacing="8"
        fill="#C9A96E">WEDDING INVITATION</text>

  <!-- 상단 장식 라인 + 꽃 -->
  <line x1="450" y1="100" x2="560" y2="100" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/>
  <line x1="640" y1="100" x2="750" y2="100" stroke="#C9A96E" stroke-width="0.8" opacity="0.6"/>
  <g transform="translate(600, 100)">
    <ellipse cx="0" cy="0" rx="4" ry="7" fill="#C9A96E" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="4" ry="7" fill="#C9A96E" opacity="0.6" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="4" ry="7" fill="#C9A96E" opacity="0.6" transform="rotate(120)"/>
    <circle cx="0" cy="0" r="2.5" fill="#8B6F47"/>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━
       신랑 (왼쪽) — 한복 입은 판다
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <g transform="translate(380, 360)" filter="url(#softShadow)">
    <!-- 한복 도포 (파란색 외투, 발끝까지) -->
    <path d="M-110,30 Q-115,90 -125,180 L125,180 Q115,90 110,30 Q60,10 0,5 Q-60,10 -110,30 Z"
          fill="url(#hanbokBlue)"/>
    <!-- 도포 옆선 -->
    <path d="M-110,30 L-125,180 M110,30 L125,180" stroke="#0F2240" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- 옥색 저고리 안감 -->
    <path d="M-90,5 Q-50,-15 0,-15 Q50,-15 90,5 Q70,30 0,35 Q-70,30 -90,5 Z"
          fill="url(#hanbokTeal)"/>
    <!-- 저고리 깃 (V) -->
    <path d="M-30,-10 L0,15 L30,-10 Z" fill="#FAFAFA" stroke="#888" stroke-width="0.8"/>
    <!-- 저고리 매듭 (홍 매듭) -->
    <ellipse cx="-12" cy="22" rx="6" ry="4" fill="#C84050"/>
    <path d="M-18,28 Q-10,40 -3,30 M-3,30 Q4,40 10,32" stroke="#C84050" stroke-width="2.5" fill="none"/>
    <path d="M-3,30 L-3,55" stroke="#C84050" stroke-width="2.5"/>

    <!-- 목 -->
    <rect x="-12" y="-30" width="24" height="22" rx="6" fill="#FFFFFF"/>

    <!-- 판다 머리 (둥글고 큼직) -->
    <!-- 판다 귀 -->
    <ellipse cx="-65" cy="-110" rx="22" ry="22" fill="#2C2420"/>
    <ellipse cx="65"  cy="-110" rx="22" ry="22" fill="#2C2420"/>
    <ellipse cx="-65" cy="-110" rx="10" ry="10" fill="#5C4A3A"/>
    <ellipse cx="65"  cy="-110" rx="10" ry="10" fill="#5C4A3A"/>

    <!-- 판다 얼굴 (흰색) -->
    <ellipse cx="0" cy="-70" rx="78" ry="72" fill="#FFFFFF"/>

    <!-- 사모(검은 갓) -->
    <ellipse cx="0" cy="-150" rx="90" ry="14" fill="#1A1410"/>
    <rect x="-32" y="-180" width="64" height="32" rx="4" fill="#1A1410"/>
    <ellipse cx="0" cy="-148" rx="92" ry="10" fill="#0A0808"/>
    <!-- 사모 양쪽 날개 -->
    <path d="M-90,-148 Q-110,-130 -100,-115 Q-85,-130 -80,-148"
          fill="#1A1410"/>
    <path d="M90,-148 Q110,-130 100,-115 Q85,-130 80,-148"
          fill="#1A1410"/>

    <!-- 판다 검은 눈 패치 -->
    <ellipse cx="-30" cy="-78" rx="20" ry="24" fill="#2C2420" transform="rotate(-12,-30,-78)"/>
    <ellipse cx="30"  cy="-78" rx="20" ry="24" fill="#2C2420" transform="rotate(12,30,-78)"/>

    <!-- 눈 (반짝) -->
    <circle cx="-28" cy="-75" r="6"  fill="#FFFFFF"/>
    <circle cx="32"  cy="-75" r="6"  fill="#FFFFFF"/>
    <circle cx="-26" cy="-73" r="3.5" fill="#1A1410"/>
    <circle cx="34"  cy="-73" r="3.5" fill="#1A1410"/>
    <circle cx="-25" cy="-75" r="1.2" fill="#FFFFFF"/>
    <circle cx="35"  cy="-75" r="1.2" fill="#FFFFFF"/>

    <!-- 코 -->
    <ellipse cx="0" cy="-50" rx="7" ry="5" fill="#2C2420"/>
    <!-- 입 -->
    <path d="M-10,-38 Q0,-32 10,-38" stroke="#2C2420" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M0,-43 L0,-40" stroke="#2C2420" stroke-width="2" stroke-linecap="round"/>

    <!-- 볼 -->
    <ellipse cx="-55" cy="-48" rx="10" ry="6" fill="#FFB8C8" opacity="0.6"/>
    <ellipse cx="55"  cy="-48" rx="10" ry="6" fill="#FFB8C8" opacity="0.6"/>
  </g>

  <!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━
       신부 (오른쪽) — 한복 입은 토끼
  ━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
  <g transform="translate(820, 360)" filter="url(#softShadow)">
    <!-- 빨간 치마 (큰 종 모양) -->
    <path d="M-130,30 Q-150,100 -170,200 L170,200 Q150,100 130,30 Q70,10 0,5 Q-70,10 -130,30 Z"
          fill="url(#hanbokRed)"/>
    <!-- 치마 주름 -->
    <path d="M-100,50 L-115,200 M-50,30 L-55,200 M0,28 L0,200 M50,30 L55,200 M100,50 L115,200"
          stroke="#7A0010" stroke-width="1" fill="none" opacity="0.4"/>

    <!-- 분홍 저고리 -->
    <path d="M-90,5 Q-50,-15 0,-15 Q50,-15 90,5 Q70,30 0,35 Q-70,30 -90,5 Z"
          fill="url(#hanbokPink)"/>
    <!-- 저고리 깃 (V) -->
    <path d="M-30,-10 L0,15 L30,-10 Z" fill="#FAFAFA" stroke="#888" stroke-width="0.8"/>
    <!-- 저고리 끝동(소매 끝 빨간 띠) -->
    <ellipse cx="-90" cy="5" rx="10" ry="8" fill="#C84050"/>
    <ellipse cx="90"  cy="5" rx="10" ry="8" fill="#C84050"/>
    <!-- 노리개 (장식 매듭) -->
    <ellipse cx="0" cy="22" rx="6" ry="4" fill="#FFD700"/>
    <path d="M0,26 L-3,55 M0,26 L3,55" stroke="#FFD700" stroke-width="2"/>
    <circle cx="-3" cy="58" r="3" fill="#C84050"/>
    <circle cx="3" cy="58" r="3" fill="#C84050"/>

    <!-- 목 -->
    <rect x="-12" y="-30" width="24" height="22" rx="6" fill="#FFFFFF"/>

    <!-- 토끼 귀 (긴, 양쪽으로 살짝 벌어짐) -->
    <ellipse cx="-32" cy="-150" rx="13" ry="44" fill="#FFFFFF" stroke="#E0CFC0" stroke-width="1.5"
             transform="rotate(-12,-32,-150)"/>
    <ellipse cx="32"  cy="-150" rx="13" ry="44" fill="#FFFFFF" stroke="#E0CFC0" stroke-width="1.5"
             transform="rotate(12,32,-150)"/>
    <!-- 귀 안쪽 분홍 -->
    <ellipse cx="-32" cy="-150" rx="6" ry="32" fill="#FFC0D0" transform="rotate(-12,-32,-150)"/>
    <ellipse cx="32"  cy="-150" rx="6" ry="32" fill="#FFC0D0" transform="rotate(12,32,-150)"/>

    <!-- 토끼 얼굴 -->
    <ellipse cx="0" cy="-70" rx="72" ry="68" fill="#FFFFFF" stroke="#E8DCD0" stroke-width="1"/>

    <!-- 족두리 (붉은색 머리장식, 정수리에) -->
    <ellipse cx="0" cy="-128" rx="34" ry="14" fill="#8B2030"/>
    <ellipse cx="0" cy="-132" rx="32" ry="12" fill="#C84050"/>
    <!-- 족두리 위 금색 장식 -->
    <circle cx="0" cy="-138" r="6" fill="#FFD700"/>
    <circle cx="-15" cy="-134" r="3" fill="#FFD700"/>
    <circle cx="15"  cy="-134" r="3" fill="#FFD700"/>
    <!-- 족두리 끈 (양옆 늘어짐) -->
    <path d="M-30,-128 Q-50,-110 -50,-90" stroke="#C84050" stroke-width="3" fill="none"/>
    <path d="M30,-128  Q50,-110  50,-90"  stroke="#C84050" stroke-width="3" fill="none"/>

    <!-- 토끼 눈 (행복한 반달) -->
    <path d="M-35,-78 Q-25,-86 -15,-78"
          stroke="#2C2420" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M15,-78 Q25,-86 35,-78"
          stroke="#2C2420" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- 속눈썹 -->
    <path d="M-37,-82 L-39,-86" stroke="#2C2420" stroke-width="2" stroke-linecap="round"/>
    <path d="M37,-82  L39,-86"  stroke="#2C2420" stroke-width="2" stroke-linecap="round"/>

    <!-- 코 (분홍 하트) -->
    <path d="M0,-58 C-6,-66 -16,-62 -12,-52 C-9,-44 0,-36 0,-36 C0,-36 9,-44 12,-52 C16,-62 6,-66 0,-58Z"
          fill="#E87090"/>
    <!-- 입 -->
    <path d="M0,-36 L0,-30" stroke="#2C2420" stroke-width="2" stroke-linecap="round"/>
    <path d="M-10,-26 Q0,-18 10,-26" stroke="#2C2420" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- 작은 이빨 -->
    <rect x="-3" y="-25" width="3" height="6" fill="#FFFFFF" stroke="#E0CFC0" stroke-width="0.8"/>
    <rect x="0"  y="-25" width="3" height="6" fill="#FFFFFF" stroke="#E0CFC0" stroke-width="0.8"/>

    <!-- 볼 (연지) -->
    <circle cx="-50" cy="-50" r="11" fill="#FF8090" opacity="0.85"/>
    <circle cx="50"  cy="-50" r="11" fill="#FF8090" opacity="0.85"/>
    <circle cx="-50" cy="-50" r="6"  fill="#E84060" opacity="0.6"/>
    <circle cx="50"  cy="-50" r="6"  fill="#E84060" opacity="0.6"/>
  </g>

  <!-- 가운데 하트 (두 사람 사이) -->
  <g transform="translate(600, 360)">
    <path d="M0,-25 C-12,-50 -50,-50 -50,-15 C-50,15 0,40 0,40 C0,40 50,15 50,-15 C50,-50 12,-50 0,-25Z"
          fill="url(#goldGrad)" opacity="0.95"/>
    <path d="M-15,-30 C-22,-42 -38,-38 -36,-22"
          stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- 하단 이름 -->
  <g transform="translate(600, 555)">
    <!-- 신랑 이름 -->
    <text x="-180" y="0" text-anchor="middle"
          font-family="'Noto Serif KR', serif" font-size="38" font-weight="500"
          fill="#2C2420" letter-spacing="6">김재현</text>
    <!-- ampersand -->
    <text x="0" y="0" text-anchor="middle"
          font-family="'Cormorant Garamond', Georgia, serif" font-style="italic"
          font-size="50" font-weight="300"
          fill="#C9A96E">&amp;</text>
    <!-- 신부 이름 -->
    <text x="180" y="0" text-anchor="middle"
          font-family="'Noto Serif KR', serif" font-size="38" font-weight="500"
          fill="#2C2420" letter-spacing="6">이혜주</text>
  </g>

  <!-- 하단 날짜 -->
  <text x="600" y="600" text-anchor="middle"
        font-family="Georgia, serif" font-size="16"
        fill="#8B6F47" letter-spacing="6">2026 . 11 . 07  SATURDAY</text>
</svg>
