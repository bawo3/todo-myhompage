<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>길찾기 · 문수컨벤션웨딩홀</title>
<style>
  body {
    margin: 0; padding: 40px 24px;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    background: linear-gradient(160deg, #FAF7F2 0%, #F0EAE0 100%);
    color: #2C2420;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .title {
    font-size: 18px; letter-spacing: 3px;
    color: #2C2420; margin-bottom: 8px;
  }
  .sub {
    font-size: 13px; color: #8B6F47;
    letter-spacing: 1px; margin-bottom: 32px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid #E8D5B0;
    border-top-color: #C9A96E;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-grid {
    display: grid; gap: 10px;
    width: 100%; max-width: 280px;
    margin-top: 20px;
  }
  .btn {
    padding: 14px;
    border: none;
    border-radius: 14px;
    font-size: 14px; letter-spacing: 2px;
    cursor: pointer;
    text-decoration: none;
    display: block;
    box-shadow: 0 4px 18px rgba(139,111,71,0.15);
  }
  .btn.kakao { background: #FEE500; color: #3A1D1D; }
  .btn.naver { background: #03C75A; color: white; }
  .btn.tmap  { background: #1B64DA; color: white; }
  .btn.home  { background: rgba(255,255,255,0.85); color: #5C4A3A; }
</style>
</head>
<body>

<div class="spinner" id="spinner"></div>
<div class="title">문수컨벤션웨딩홀</div>
<div class="sub">길찾기 앱으로 이동합니다...</div>

<!-- 폴백 버튼 (자동 실행 실패 시 표시) -->
<div class="btn-grid" id="fallback" style="display:none">
  <a class="btn kakao" href="https://map.kakao.com/link/to/문수컨벤션웨딩홀,35.5359834,129.2586323">🗺 카카오맵으로 보기</a>
  <a class="btn naver" href="https://map.naver.com/v5/search/문수컨벤션웨딩홀">🗺 네이버지도로 보기</a>
  <a class="btn tmap"  href="https://tmap.life/route?goalname=문수컨벤션웨딩홀&goalx=129.2586323&goaly=35.5359834">🚗 티맵 길찾기</a>
  <a class="btn home"  href="/">청첩장으로 돌아가기</a>
</div>

<script>
/* 문수컨벤션 좌표 */
const VENUE = {
  name: '문수컨벤션웨딩홀',
  lat:  35.5359834,
  lng:  129.2586323,
  addr: '울산광역시 남구 문수로 44'
};

/* 모바일 / 데스크탑 판별 */
const ua = navigator.userAgent || '';
const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);

/* 즉시 카카오맵으로 이동 */
const target = `https://map.kakao.com/link/to/${encodeURIComponent(VENUE.name)},${VENUE.lat},${VENUE.lng}`;

if (isMobile) {
  /* 모바일: 카카오맵 앱 딥링크 시도 → 실패 시 웹 */
  const deepLink = `kakaomap://route?ep=${VENUE.lat},${VENUE.lng}&by=CAR`;
  let didLeave = false;
  const onHide = () => { didLeave = true; };
  document.addEventListener('visibilitychange', onHide);
  window.addEventListener('pagehide', onHide);

  window.location.href = deepLink;

  /* 1.2초 후에도 페이지에 남아있으면 → 웹 카카오맵으로 */
  setTimeout(() => {
    if (!didLeave) {
      window.location.href = target;
    }
  }, 1200);
} else {
  /* 데스크탑: 바로 카카오맵 웹 */
  window.location.replace(target);
}

/* 3.5초 후에도 페이지에 남아있으면 폴백 버튼 표시 */
setTimeout(() => {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('fallback').style.display = 'grid';
}, 3500);
</script>
</body>
</html>
